server {
    listen 80;
    server_name hdu.sakura-bot.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hdu.sakura-bot.cn;

    root /www/wwwroot/hdu.sakura-bot.cn;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/hdu.sakura-bot.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/hdu.sakura-bot.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    error_page 497 https://$host$request_uri;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1h;
        access_log off;
    }

    access_log /www/wwwlogs/hdu.sakura-bot.cn.log;
    error_log /www/wwwlogs/hdu.sakura-bot.cn.error.log;
}
