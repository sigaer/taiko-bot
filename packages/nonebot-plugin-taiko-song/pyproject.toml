[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "nonebot-plugin-taiko-song"
version = "0.2.0"
description = "Taiko public song command entry"
requires-python = ">=3.11"
dependencies = ["taiko-application==0.5.0", "nonebot2>=2.4.0", "nonebot-adapter-onebot>=2.4.0", "nonebot-adapter-qq>=1.6.0", "fuzzywuzzy==0.18.0"]
[tool.setuptools.packages.find]
where = ["src"]
